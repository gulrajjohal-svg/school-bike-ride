<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bike to School 3D</title>
<style>
:root{--sky:#8fd3f4;--panel:#fffaf0;--ink:#23304a;--accent:#ff8a2b;--soft:#e9e2d2;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1d2a47;--ink:#f2f5ff;--soft:#2c3b5e}}
:root[data-theme="dark"]{--panel:#1d2a47;--ink:#f2f5ff;--soft:#2c3b5e}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:"Trebuchet MS","Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
#lives{font-size:30px;letter-spacing:3px}.dead{opacity:.3}
#right{text-align:right;font-size:14px}
#bar{width:min(40vw,220px);height:12px;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden;margin:4px 0 6px auto}
#fill{height:100%;width:0;background:#ffc21a}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,22,40,.6);padding:12px;overflow:auto}
.card{background:var(--panel);color:var(--ink);border-radius:20px;padding:24px 26px;text-align:center;width:min(100%,430px);max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font-size:32px}.card h2{margin:0 0 10px}
.card p{margin:0 0 14px;line-height:1.4}
button{font:inherit;font-weight:bold;font-size:18px;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:10px 28px;cursor:pointer;margin:4px}
button.alt{background:var(--soft);color:var(--ink)}
button.sel{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.diffs button{font-size:15px;padding:8px 14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.item small{display:block;opacity:.8}
.item button{font-size:15px;padding:8px 14px;margin:0;white-space:nowrap}
.sign{background:#d62f2f;color:#fff;border:6px solid #fff;border-radius:16px;padding:16px 20px;font-size:clamp(32px,9vw,54px);font-weight:900;letter-spacing:2px;box-shadow:0 8px 0 #6b4a2b;margin-bottom:20px}
#abil{position:fixed;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px}
#abil button{margin:0;font-size:16px;padding:12px 18px}
#comp{text-align:center;font-size:14px;line-height:1.2}
#touch{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch>div{display:flex;gap:10px;pointer-events:auto}
#touch button{margin:0;width:74px;height:74px;border-radius:50%;padding:0;font-size:16px;opacity:.85;touch-action:none}
@media (pointer:coarse){#touch{display:flex}}
.hidden{display:none!important}
</style>
</head>

function makeRamp(o){const m=new THREE.Group();
  const p=box(2.8,0.3,4.6,0x8a8a92);p.rotation.x=0.3;p.position.y=0.65;m.add(p);

function syncChunks(px,pz){

  rebuild();
}

 '<p style="font-size:13px;opacity:.8;margin:10px 0 0">Steer anywhere with Left/Right or A/D. Space: jump. F or Down: backflip. B or Up: boost (recharges). Shift: brake. E: slow-mo, Q: bulldozer. On a phone use the on-screen buttons. Follow the arrow to the school.</p>');}

  return '<div class="item"><div><b>'+m[0]+'</b><small style="display:flex;gap:3px;margin-top:4px">'+[m[2],m[3][0],m[3][2],m[5]].map(c=>'<i style="width:16px;height:10px;border-radius:3px;background:#'+c.toString(16).padStart(6,'0')+'"></i>').join('')+'</small></div><button data-act="'+(own?'pick':'bmap')+'" data-v="'+i+'" '+(sel||(!own&&S.coins<m[1])?'disabled':'')+'>'+(sel?'Selected':own?'Use':m[1]+' coins')+'</button></div>';}).join('')+
 '<button class="alt" data-act="menu">Back</button>');}

  case'buy':{const it=SHOP.find(x=>x.k===v),c=it.cost(S[v]);if(S[v]<it.max&&S.coins>=c){S.coins-=c;S[v]++;save();}shop();break;}}});

  const D=DIFFS[diff];GOAL=goalFor(D);SX=0;SZ=-GOAL-16;initDist=GOAL+16;
  applyMap(S.map);clearWorld();schoolG.position.set(SX,0,SZ);gcx=1e9;walkers.forEach(initWalker);
  lives=3+S.life;speed=D.b;vy=0;inv=0;floorOff=0;slowT=0;smashT=0;cdSlow=0;cdSmash=0;boostT=0;cdBoost=0;regenT=0;

function finish(won){
  const mult=DIFFS[diff].mult;
  const earned=Math.floor((Math.floor(trav/60)*mult+flips*10*mult*(1+0.5*S.stunt)+(won?100*mult:0))*(1+0.25*S.coinx));
  S.coins+=earned;save();state=won?'win':'over';
  show((won?'<h1>You made it!</h1><p>You reached school with '+lives+(lives===1?' life':' lives')+' left.</p>':'<div class="sign">GAME OVER</div><p>You ran out of lives before school.</p>')+
   '<p>Flips: '+flips+' · Coins earned: <b>+'+earned+'</b></p><button data-act="start">'+(won?'Play again':'Try again')+'</button><button class="alt" data-act="shop">Shop</button><button class="alt" data-act="menu">Menu</button>');
}
function hit(){
  if(smashT>0)return;
  if(hasShield){hasShield=false;inv=1;shake=0.25;drawInfo();return;}
  lives--;inv=1.5;shake=0.4;drawLives();if(lives<=0)finish(false);

function doFlip(){if(state==='play'&&!onG&&!flipping){flipping=true;angle=0.001;}}
function jump(){
  if(state!=='play')return;
  const jv=9.8+2.4*S.jump;
  if(onG){vy=jv;onG=false;}
  else if(S.dbl&&!usedDbl){usedDbl=true;vy=jv*0.9;}

const $=id=>document.getElementById(id);

const keys={},hold={};

function keyset(c,v){
  if(c==='ArrowLeft'||c==='KeyA')keys.L=v;
  if(c==='ArrowRight'||c==='KeyD')keys.R=v;
    if(c==='ShiftLeft'||c==='ShiftRight'||c==='KeyS')keys.brake=v;

  const c=e.code;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)&&state==='play')e.preventDefault();
  keyset(c,true);
  if(c==='Space')jump();
  if(c==='ArrowDown'||c==='KeyF'||c==='KeyX')doFlip();

addEventListener('keyup',e=>keyset(e.code,false));
const angDiff=(a,b)=>((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI;

function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.033,(now-last)/1000);last=now;
  if(slowT>0)slowT-=rdt;if(smashT>0)smashT-=rdt;if(cdSlow>0)cdSlow-=rdt;if(cdSmash>0)cdSmash-=rdt;if(boostT>0)boostT-=rdt;if(cdBoost>0)cdBoost-=rdt;
  const dt=slowT>0?rdt*0.5:rdt;t+=dt;
  const D=DIFFS[diff];
  updGround(kid.position.x,kid.position.z);syncChunks(kid.position.x,kid.position.z);
  if(state==='play'){
    speed=D.b+(D.m-D.b)*Math.min(1,Math.min(1,trav/GOAL)*1.6);
    if(boostT>0)speed*=1.6;if(keys.brake)speed*=0.55;

    const pt=air?0:Math.atan((hgt(kp.x+dx*1.5,kp.z+dz*1.5)-hgt(kp.x-dx*1.5,kp.z-dz*1.5))/3);
    pitch+=(pt-pitch)*Math.min(1,dt*8);
    kid.rotation.set(pitch,-heading,-steer*0.3,'YXZ');
    if(flipping){angle+=dt*TAU/(0.65-0.12*S.stunt);if(angle>=TAU){angle=0;flipping=false;flips++;drawInfo();}}
    pivot.rotation.x=angle;
    if(wasAir&&!air){usedDbl=false;if(flipping&&angle>0.9&&angle<5.4)hit();flipping=false;angle=0;pivot.rotation.x=0;}
    wasAir=air;
    if(inv>0){inv-=dt;bike.visible=Math.floor(inv*10)%2===0;if(inv<=0)bike.visible=true;}
    if(S.regen&&lives<3+S.life){regenT+=dt;if(regenT>=(S.regen>1?40:60)){regenT=0;lives++;drawLives();}}else regenT=0;
    bubble.visible=hasShield||smashT>0;bubble.material.color.set(smashT>0?0xff5533:0x66ccff);
    const rr=0.5-0.06*S.grip;
    for(const o of objs){
      const ex=o.x-kp.x,ez=o.z-kp.z;if(ex>12||ex<-12||ez>12||ez<-12||o.gone)continue;
      const d2=ex*ex+ez*ez;
      if(o.t==='ramp'||o.t==='dip'){
        if(d2<5.5&&kp.y-o.y<0.9&&o.cool<=t){o.cool=t+1.5;vy=((o.t==='dip'&&floorOff<-0.3)?19:15)+2*S.ramp;kp.y+=0.05;onG=false;}
      }else if(!o.done&&d2<(o.r+rr)*(o.r+rr)&&kp.y-o.y<o.h-0.1){
        o.done=true;if(smashT>0){o.gone=true;dirty=true;}else if(inv<=0&&!(o.t==='pit'&&S.tough))hit();
      }
    }
    const sdx=SX-kp.x,sdz=SZ-kp.z,dist=Math.hypot(sdx,sdz);
    arrow.visible=true;arrow.position.set(kp.x,kp.y+3.8+Math.sin(t*4)*0.15,kp.z);arrow.rotation.y=-Math.atan2(sdx,-sdz);
    fill.style.width=Math.max(0,Math.min(100,(1-dist/initDist)*100))+'%';
    comp.innerHTML='<span style="display:inline-block;transform:rotate('+(Math.atan2(sdx,-sdz)-heading)+'rad);font-size:38px">▲</span><br>School '+Math.round(dist)+' m · '+fmt(dist/Math.max(speed,1));

  }
  const spin=state==='play'?speed*dt/0.45:0;wheels.forEach(w=>{w.rotation.x-=spin;});
  const pd=Math.sin(t*(state==='play'?speed:6)*0.6)*0.7;legs[0].rotation.x=pd;legs[1].rotation.x=-pd;
  shake=Math.max(0,shake-dt);
  abil.classList.toggle('hidden',state!=='play');touch.classList.toggle('hidden',state!=='play');if(state!=='play')arrow.visible=false;
  bS.classList.toggle('hidden',!S.slow);bM.classList.toggle('hidden',!S.smash);
  bS.textContent=slowT>0?'Slow-mo on':cdSlow>0?'Slow-mo '+Math.ceil(cdSlow):'Slow-mo (E)';bS.disabled=slowT>0||cdSlow>0;
  bM.textContent=smashT>0?'Bulldozer on':cdSmash>0?'Bulldozer '+Math.ceil(cdSmash):'Bulldozer (Q)';bM.disabled=smashT>0||cdSmash>0;
  bB.textContent=boostT>0?'Boosting!':cdBoost>0?'Boost '+Math.ceil(cdBoost):'Boost (B)';bB.disabled=boostT>0||cdBoost>0;
  if(Math.hypot(SX-kid.position.x,SZ-kid.position.z)<400)for(const w of walkers){
    if(w.sp){w.lz-=w.sp*dt;if(w.lz<7)w.lz=150+Math.random()*20;}
    const wx=SX+w.lx,wz=SZ+w.lz,p=w.p;p.position.set(wx,hgt(wx,wz),wz);
    const s=w.sp?Math.sin(t*w.sp*4+w.ph):0;p.legs[0].rotation.x=s*0.6;p.legs[1].rotation.x=-s*0.6;p.position.y+=Math.abs(s)*0.06;}
  camH+=angDiff(heading,camH)*Math.min(1,rdt*5);
  const cdx=Math.sin(camH),cdz=-Math.cos(camH),kp2=kid.position;
  const cxp=kp2.x-cdx*8+(shake?(Math.random()-.5)*shake:0),czp=kp2.z-cdz*8;
  camY+=(Math.max(kp2.y+3.4,hgt(cxp,czp)+1.8)-camY)*Math.min(1,rdt*8);
  camera.position.set(cxp,camY,czp);
  camera.lookAt(kp2.x+cdx*9,kp2.y+1.3,kp2.z+cdz*9);
  const fv=62+(boostT>0?12:0);if(Math.abs(camera.fov-fv)>0.1){camera.fov+=(fv-camera.fov)*Math.min(1,rdt*6);camera.updateProjectionMatrix();}
  renderer.render(root,camera);
}
applyMap(S.map);drawLives();menu();requestAnimationFrame(frame);
